name: Build & Release

on:
  push:
    tags:
      - "v*"          # 推送 vX.Y.Z tag 时触发
  workflow_dispatch:  # 允许手动触发

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # ── macOS arm64 (Apple Silicon) ─────────────────────────────
  build-macos-arm64:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install flask pymupdf openpyxl requests \
                      zxing-cpp opencv-python-headless pyinstaller \
                      pyobjc-framework-Vision pyobjc-framework-Quartz

      - name: 安装 create-dmg
        run: brew install create-dmg

      - name: 打包
        run: bash build/macos/build_macos.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  # ── macOS x86_64 (Intel) ────────────────────────────────────
  build-macos-x64:
    runs-on: macos-13   # Intel runner（runner 资源有限，不阻塞 release）
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install flask pymupdf openpyxl requests \
                      zxing-cpp opencv-python-headless pyinstaller \
                      pyobjc-framework-Vision pyobjc-framework-Quartz

      - name: 安装 create-dmg
        run: brew install create-dmg

      - name: 打包
        run: bash build/macos/build_macos.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: dist/*.dmg

  # ── Windows x64 ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Tesseract
        run: choco install tesseract --params "/Languages:chi_sim" -y

      - name: 安装依赖
        run: |
          pip install flask pymupdf openpyxl requests `
                      zxing-cpp opencv-python-headless pyinstaller `
                      pytesseract pillow

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 打包
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # PyInstaller
          pyinstaller build/cert_splitter.spec `
            --distpath dist `
            --workpath build/_pyinstaller_work `
            --noconfirm
          if (-not (Test-Path "dist/批签发拆分工具")) {
            Write-Error "PyInstaller 输出目录不存在"; exit 1
          }

          # 复制 Tesseract 语言包
          $tessData = "C:\Program Files\Tesseract-OCR\tessdata"
          if (Test-Path $tessData) {
            New-Item -ItemType Directory -Force "dist/批签发拆分工具/tessdata" | Out-Null
            Copy-Item "$tessData\chi_sim.traineddata","$tessData\eng.traineddata" `
              "dist/批签发拆分工具/tessdata/" -ErrorAction SilentlyContinue
          }

          # Inno Setup
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $iscc) { Write-Error "未找到 Inno Setup"; exit 1 }
          $ver = $env:VERSION -replace '^v',''   # strip leading 'v'
          & $iscc "build\windows\installer.iss" "/DMyAppVersion=$ver"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup 失败 ($LASTEXITCODE)"; exit 1 }
          Write-Host "✓ Windows 安装包已生成"
          Get-ChildItem dist/*.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  # ── Kylin / UOS (aarch64 + x86_64) ─────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    continue-on-error: true   # Linux 失败不阻塞 macOS/Windows release
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 QEMU（aarch64 交叉编译）
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: 打包（Docker）
        run: |
          ARCH=${{ matrix.arch }}
          PLATFORM="linux/amd64"
          if [ "$ARCH" = "aarch64" ]; then
            PLATFORM="linux/arm64"
          fi
          # 统一用多架构镜像，由 --platform 决定拉哪个变体
          # Bullseye = glibc 2.31，兼容麒麟/UOS
          IMAGE="python:3.11-slim-bullseye"
          docker run --rm --platform "$PLATFORM" \
            -v "$PWD:/app" -w /app \
            -e VERSION="${{ github.ref_name }}" \
            "$IMAGE" bash build/linux/build_linux.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.deb

  # ── 发布 GitHub Release ──────────────────────────────────────
  release:
    needs: [build-macos-arm64, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: 生成 SHA256
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
