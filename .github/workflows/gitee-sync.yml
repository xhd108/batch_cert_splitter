name: Sync to Gitee

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload_release:
        description: "同步最新 Release 文件到 Gitee（填写 tag，如 v1.0.0）"
        required: false
        default: ""

jobs:
  # ── 镜像代码 ────────────────────────────────────────────────
  mirror-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送代码到 Gitee
        run: |
          git remote add gitee "https://xhd108:${{ secrets.GITEE_TOKEN }}@gitee.com/xhd108/batch_cert_splitter.git"
          git push gitee --all --force
          git push gitee --tags --force

  # ── 同步 Release 文件（仅 tag push 或手动指定） ─────────────
  mirror-release:
    runs-on: ubuntu-latest
    needs: mirror-code
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.upload_release != '')
    steps:
      - name: 确定版本号
        id: ver
        run: |
          if [ -n "${{ inputs.upload_release }}" ]; then
            echo "tag=${{ inputs.upload_release }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 下载 GitHub Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir release_assets
          gh release download "$TAG" \
            --repo xhd108/batch_cert_splitter \
            --dir release_assets
          ls release_assets/

      - name: 创建 Gitee Release 并上传文件
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # 若已存在则先删除（允许重跑）
          EXIST=$(curl -sf \
            "https://gitee.com/api/v5/repos/xhd108/batch_cert_splitter/releases/tags/$TAG?access_token=$GITEE_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          if [ -n "$EXIST" ]; then
            curl -sf -X DELETE \
              "https://gitee.com/api/v5/repos/xhd108/batch_cert_splitter/releases/$EXIST" \
              -d "access_token=$GITEE_TOKEN" || true
          fi

          # 创建 Release
          BODY="Auto sync from GitHub Release $TAG"
          RELEASE=$(curl -sf -X POST \
            "https://gitee.com/api/v5/repos/xhd108/batch_cert_splitter/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"$BODY\",\"target_commitish\":\"master\"}")
          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Gitee Release ID: $RELEASE_ID"

          # 上传每个文件
          for f in release_assets/*; do
            [ -f "$f" ] || continue
            echo "上传: $(basename $f)"
            curl -sf -X POST \
              "https://gitee.com/api/v5/repos/xhd108/batch_cert_splitter/releases/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$f" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('  OK:', d.get('browser_download_url',''))" \
              || echo "  ⚠ 上传失败: $(basename $f)"
          done
